name: CD - Deploy to Production
# 
on:
  push:
    branches: [ main ]
    paths:
      - 'k8s/**'
      - '.github/workflows/cd-prod.yml'
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  PROD_NS: production

jobs:
  deploy_prod:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        run: |
          az aks get-credentials --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
                                 --name ${{ secrets.AKS_CLUSTER_NAME }} --overwrite-existing

      - name: Ensure Namespace
        run: kubectl create namespace ${{ env.PROD_NS }} || echo "exists"

      - name: Inject ACR into Manifests
        run: |
          find k8s -type f -name '*.yaml' -print0 | xargs -0 sed -i "s|ACR_LOGIN_SERVER|${{ env.ACR_LOGIN_SERVER }}|g"

      - name: Apply Manifests
        run: kubectl -n ${{ env.PROD_NS }} apply -f k8s/

      - name: Wait for Backend IPs
        run: |
          PRODUCT_IP=$(kubectl -n ${{ env.PROD_NS }} get svc product-service-w10e1 -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          ORDER_IP=$(kubectl -n ${{ env.PROD_NS }} get svc order-service-w10e1 -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          CUSTOMER_IP=$(kubectl -n ${{ env.PROD_NS }} get svc customer-service-w10e1 -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "PRODUCT_IP=$PRODUCT_IP" >> $GITHUB_ENV
          echo "ORDER_IP=$ORDER_IP" >> $GITHUB_ENV
          echo "CUSTOMER_IP=$CUSTOMER_IP" >> $GITHUB_ENV

      - name: Inject Backend URLs into Frontend
        run: |
          sed -i "s|const PRODUCT_API_BASE_URL = ''|const PRODUCT_API_BASE_URL = 'http://${PRODUCT_IP}:8000'|g" frontend/main.js
          sed -i "s|const ORDER_API_BASE_URL = ''|const ORDER_API_BASE_URL = 'http://${ORDER_IP}:8001'|g" frontend/main.js
          sed -i "s|const CUSTOMER_API_BASE_URL = ''|const CUSTOMER_API_BASE_URL = 'http://${CUSTOMER_IP}:8002'|g" frontend/main.js

      - name: Build & Push Frontend with Production URLs
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/frontend:latest ./frontend
          docker push ${{ env.ACR_LOGIN_SERVER }}/frontend:latest

      - name: Redeploy Frontend
        run: kubectl -n ${{ env.PROD_NS }} rollout restart deployment/frontend

      - name: Logout from Azure
        run: az logout
        if: always()

