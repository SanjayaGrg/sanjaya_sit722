name: Staging Deployment

on:
  repository_dispatch:
    types: [deploy-staging]

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}-staging
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}-staging

jobs:
  deploy-to-staging:
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Create staging resource group
      run: |
        az group create --name ${{ env.RESOURCE_GROUP }} --location australiaeast

    - name: Create AKS cluster for staging
      run: |
        az aks create \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.AKS_CLUSTER_NAME }} \
          --node-count 2 \
          --enable-addons monitoring \
          --generate-ssh-keys

    - name: Get AKS credentials
      run: |
        az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER_NAME }} --overwrite-existing

    - name: Attach ACR to AKS
      run: |
        az aks update --name ${{ env.AKS_CLUSTER_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --attach-acr ${{ env.ACR_LOGIN_SERVER }}

    - name: Deploy to staging
      run: |
        # Replace ACR placeholders in Kubernetes manifests
        sed -i "s|ACR_LOGIN_SERVER|${{ env.ACR_LOGIN_SERVER }}|g" k8s-manifests/*.yaml
        
        # Apply all Kubernetes manifests
        kubectl apply -f k8s-manifests/

    - name: Wait for services to be ready
      run: |
        kubectl wait --for=condition=ready pod -l app=product-service --timeout=300s
        kubectl wait --for=condition=ready pod -l app=order-service --timeout=300s
        kubectl wait --for=condition=ready pod -l app=customer-service --timeout=300s
        kubectl wait --for=condition=ready pod -l app=frontend --timeout=300s

    - name: Get service URLs for testing
      run: |
        echo "Frontend URL:"
        kubectl get service frontend-w10 -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
        echo ""
        echo "Product Service URL:"
        kubectl get service product-service-w10 -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
        echo ":8000"

    - name: Logout from Azure
      run: |
        az logout
      if: always()

  manual-testing:
    runs-on: ubuntu-latest
    needs: deploy-to-staging
    environment: staging
    
    steps:
    - name: Wait for manual testing
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: 'Staging environment is ready for manual testing. Please test the application and approve or reject the deployment.'
          })

    - name: Manual approval
      uses: trstringer/manual-approval@v1
      with:
        secret: ${{ github.token }}
        approvers: ${{ vars.APPROVERS }}
        minimum-approvals: 1

  destroy-staging:
    runs-on: ubuntu-latest
    needs: manual-testing
    if: always()
    
    steps:
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Delete staging resource group
      run: |
        az group delete --name ${{ env.RESOURCE_GROUP }} --yes --no-wait

    - name: Logout from Azure
      run: |
        az logout
      if: always()