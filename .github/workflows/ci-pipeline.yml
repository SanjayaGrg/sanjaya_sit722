name: CI Pipeline - Test and Build

on:
  push:
    branches: [ testing ]
  pull_request:
    branches: [ testing ]

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test-backend-services:
    runs-on: ubuntu-latest
    services:
      product_db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: products
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      order_db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orders
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      customer_db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customers
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5434:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        # Install dependencies for all services
        pip install -r backend/product_service/requirements.txt
        pip install -r backend/order_service/requirements.txt
        pip install -r backend/customer_service/requirements.txt
        pip install pytest httpx

    - name: Run Product Service tests
      working-directory: backend/product_service
      env:
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_DB: products
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        AZURE_STORAGE_ACCOUNT_NAME: test
        AZURE_STORAGE_ACCOUNT_KEY: test
        AZURE_STORAGE_CONTAINER_NAME: test
      run: |
        pytest tests/ -v

    - name: Run Order Service tests
      working-directory: backend/order_service
      env:
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5433
        POSTGRES_DB: orders
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        PRODUCT_SERVICE_URL: http://localhost:8000
      run: |
        pytest tests/ -v

    - name: Run Customer Service tests
      working-directory: backend/customer_service
      env:
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5434
        POSTGRES_DB: customers
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        PRODUCT_SERVICE_URL: http://localhost:8000
      run: |
        pytest tests/ -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: test-backend-services
    if: github.ref == 'refs/heads/testing' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to ACR
      run: |
        az acr login --name ${{ env.ACR_LOGIN_SERVER }}

    - name: Build and push Product Service
      run: |
        docker build -t ${{ env.ACR_LOGIN_SERVER }}/product_service:${{ env.IMAGE_TAG }} ./backend/product_service/
        docker push ${{ env.ACR_LOGIN_SERVER }}/product_service:${{ env.IMAGE_TAG }}

    - name: Build and push Order Service
      run: |
        docker build -t ${{ env.ACR_LOGIN_SERVER }}/order_service:${{ env.IMAGE_TAG }} ./backend/order_service/
        docker push ${{ env.ACR_LOGIN_SERVER }}/order_service:${{ env.IMAGE_TAG }}

    - name: Build and push Customer Service
      run: |
        docker build -t ${{ env.ACR_LOGIN_SERVER }}/customer_service:${{ env.IMAGE_TAG }} ./backend/customer_service/
        docker push ${{ env.ACR_LOGIN_SERVER }}/customer_service:${{ env.IMAGE_TAG }}

    - name: Build and push Frontend
      run: |
        docker build -t ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }} ./frontend/
        docker push ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }}

    - name: Update latest tags
      run: |
        docker tag ${{ env.ACR_LOGIN_SERVER }}/product_service:${{ env.IMAGE_TAG }} ${{ env.ACR_LOGIN_SERVER }}/product_service:latest
        docker tag ${{ env.ACR_LOGIN_SERVER }}/order_service:${{ env.IMAGE_TAG }} ${{ env.ACR_LOGIN_SERVER }}/order_service:latest
        docker tag ${{ env.ACR_LOGIN_SERVER }}/customer_service:${{ env.IMAGE_TAG }} ${{ env.ACR_LOGIN_SERVER }}/customer_service:latest
        docker tag ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }} ${{ env.ACR_LOGIN_SERVER }}/frontend:latest
        
        docker push ${{ env.ACR_LOGIN_SERVER }}/product_service:latest
        docker push ${{ env.ACR_LOGIN_SERVER }}/order_service:latest
        docker push ${{ env.ACR_LOGIN_SERVER }}/customer_service:latest
        docker push ${{ env.ACR_LOGIN_SERVER }}/frontend:latest

    - name: Logout from Azure
      run: |
        az logout
      if: always()

    - name: Trigger Staging Deployment
      run: |
        curl -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type": "deploy-staging", "client_payload": {"image_tag": "${{ env.IMAGE_TAG }}"}}'