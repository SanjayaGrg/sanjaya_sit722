name: CI - Build, Test, Push Images to ACR (testing branch)
# 
on:
  push:
    branches: [ testing ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ testing ]
  workflow_dispatch:

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}                    
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}     
  IMAGE_TAG: testing                                     

jobs:
  test_services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Minimal placeholder tests (replace with real tests when available)
      - name: Run placeholder tests
        run: |
          echo "Backend/Frontend placeholder tests"
          # Add pytest, unit tests, etc. when your code is ready

  build_and_push:
    runs-on: ubuntu-latest
    needs: test_services
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      # Build & push all 4 services with :testing tag (for staging)
      - name: Build & Push Product Service
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/product_service:${{ env.IMAGE_TAG }} ./backend/product_service
          docker push ${{ env.ACR_LOGIN_SERVER }}/product_service:${{ env.IMAGE_TAG }}

      - name: Build & Push Order Service
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/order_service:${{ env.IMAGE_TAG }} ./backend/order_service
          docker push ${{ env.ACR_LOGIN_SERVER }}/order_service:${{ env.IMAGE_TAG }}

      - name: Build & Push Customer Service
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/customer_service:${{ env.IMAGE_TAG }} ./backend/customer_service
          docker push ${{ env.ACR_LOGIN_SERVER }}/customer_service:${{ env.IMAGE_TAG }}

      - name: Build & Push Frontend
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }} ./frontend
          docker push ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }}

      - name: Logout
        run: az logout
        if: always()
