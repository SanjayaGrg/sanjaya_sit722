name: CD - Deploy to Staging
# 
on:
  push:
    branches: [ testing ]
    paths:
      - 'k8s/**'
      - '.github/workflows/cd-staging.yml'
  workflow_dispatch:

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  STAGING_NS: staging-${{ github.run_id }}

jobs:
  deploy_staging:
    runs-on: ubuntu-latest
    environment: Staging

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        run: |
          az aks get-credentials --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
                                 --name ${{ secrets.AKS_CLUSTER_NAME }} --overwrite-existing

      - name: Create Staging Namespace
        run: kubectl create namespace ${{ env.STAGING_NS }}

      - name: Inject ACR into Manifests
        run: |
          find k8s -type f -name '*.yaml' -print0 | xargs -0 sed -i "s|ACR_LOGIN_SERVER|${{ env.ACR_LOGIN_SERVER }}|g"

      - name: Deploy Backends
        run: kubectl -n ${{ env.STAGING_NS }} apply -f k8s/

      - name: Wait for Service IPs
        run: |
          echo "Waiting for Product Service IP..."
          for i in {1..60}; do
            PRODUCT_IP=$(kubectl -n ${{ env.STAGING_NS }} get svc product-service-w10e1 -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ ! -z "$PRODUCT_IP" ]; then
              echo "PRODUCT_IP=$PRODUCT_IP" >> $GITHUB_ENV
              break
            fi
            sleep 5
          done

          echo "Waiting for Order Service IP..."
          for i in {1..60}; do
            ORDER_IP=$(kubectl -n ${{ env.STAGING_NS }} get svc order-service-w10e1 -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ ! -z "$ORDER_IP" ]; then
              echo "ORDER_IP=$ORDER_IP" >> $GITHUB_ENV
              break
            fi
            sleep 5
          done

          echo "Waiting for Customer Service IP..."
          for i in {1..60}; do
            CUSTOMER_IP=$(kubectl -n ${{ env.STAGING_NS }} get svc customer-service-w10e1 -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ ! -z "$CUSTOMER_IP" ]; then
              echo "CUSTOMER_IP=$CUSTOMER_IP" >> $GITHUB_ENV
              break
            fi
            sleep 5
          done

      - name: Inject Backend URLs into Frontend
        run: |
          sed -i "s|const PRODUCT_API_BASE_URL = ''|const PRODUCT_API_BASE_URL = 'http://${PRODUCT_IP}:8000'|g" frontend/main.js
          sed -i "s|const ORDER_API_BASE_URL = ''|const ORDER_API_BASE_URL = 'http://${ORDER_IP}:8001'|g" frontend/main.js
          sed -i "s|const CUSTOMER_API_BASE_URL = ''|const CUSTOMER_API_BASE_URL = 'http://${CUSTOMER_IP}:8002'|g" frontend/main.js

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & Push Frontend with Staging URLs
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/frontend:staging ./frontend
          docker push ${{ env.ACR_LOGIN_SERVER }}/frontend:staging

      - name: Deploy Frontend
        run: kubectl -n ${{ env.STAGING_NS }} apply -f k8s/

      - name: Smoke Test (Optional)
        run: curl -f http://${PRODUCT_IP}:8000/docs || exit 1

      - name: Destroy Staging Namespace
        if: always()
        run: kubectl delete ns ${{ env.STAGING_NS }}

      - name: Logout from Azure
        run: az logout
        if: always()
