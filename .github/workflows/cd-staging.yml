name: CD - Deploy to Temporary Staging

on:
  workflow_run:
    workflows: [ "ci.yml" ]   # Use filename instead of workflow name
    types: [ completed ]
  workflow_dispatch:
    inputs:
      aks_resource_group:
        description: "AKS Resource Group"
        required: false
        default: ""
      aks_cluster_name:
        description: "AKS Cluster Name"
        required: false
        default: ""

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  STAGING_NS: staging-w10e1
  TEST_TAG: testing

jobs:
  deploy_staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: Staging

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        run: |
          RG="${{ github.event.inputs.aks_resource_group || secrets.AKS_RESOURCE_GROUP }}"
          AKS="${{ github.event.inputs.aks_cluster_name    || secrets.AKS_CLUSTER_NAME }}"
          az aks get-credentials --resource-group "$RG" --name "$AKS" --overwrite-existing

      - name: Attach ACR (idempotent)
        run: |
          RG="${{ github.event.inputs.aks_resource_group || secrets.AKS_RESOURCE_GROUP }}"
          AKS="${{ github.event.inputs.aks_cluster_name    || secrets.AKS_CLUSTER_NAME }}"
          az aks update --name "$AKS" --resource-group "$RG" --attach-acr ${{ env.ACR_NAME }}

      - name: Create temporary STAGING namespace
        run: kubectl create namespace ${{ env.STAGING_NS }} || echo "exists"

      - name: Inject ACR into manifests
        run: |
          find k8s -type f -name '*.yaml' -print0 | xargs -0 sed -i "s|ACR_LOGIN_SERVER|${{ env.ACR_LOGIN_SERVER }}|g"

      - name: Apply manifests to STAGING
        run: kubectl -n ${{ env.STAGING_NS }} apply -f k8s/

      - name: Use :testing tags in STAGING
        run: |
          kubectl -n ${{ env.STAGING_NS }} set image deployment/product-service-w10e1 \
            product-service-container=${{ env.ACR_LOGIN_SERVER }}/product_service:${{ env.TEST_TAG }}
          kubectl -n ${{ env.STAGING_NS }} set image deployment/order-service-w10e1 \
            order-service-container=${{ env.ACR_LOGIN_SERVER }}/order_service:${{ env.TEST_TAG }}
          kubectl -n ${{ env.STAGING_NS }} set image deployment/customer-service-w10e1 \
            customer-service-container=${{ env.ACR_LOGIN_SERVER }}/customer_service:${{ env.TEST_TAG }}
          kubectl -n ${{ env.STAGING_NS }} set image deployment/frontend \
            frontend-container=${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.TEST_TAG }}

      - name: Smoke test (rollout status)
        run: |
          kubectl -n ${{ env.STAGING_NS }} rollout status deployment/product-service-w10e1 --timeout=180s
          kubectl -n ${{ env.STAGING_NS }} rollout status deployment/order-service-w10e1 --timeout=180s
          kubectl -n ${{ env.STAGING_NS }} rollout status deployment/customer-service-w10e1 --timeout=180s
          kubectl -n ${{ env.STAGING_NS }} rollout status deployment/frontend --timeout=180s

      - name: Destroy STAGING namespace (ephemeral)
        run: kubectl delete namespace ${{ env.STAGING_NS }}

      - name: Logout
        run: az logout
        if: always()
